# /etc/nginx/sites-available/octanebula.dev  (certbot --nginx adds the 443 bits)
#
# Prerendered pages and build assets come straight off disk; anything that
# isn't a file (/, /api/stats.json, /_image) goes to the Astro server that
# pm2 runs as 'website' on 127.0.0.1:4530.

upstream octanebula_site {
    server 127.0.0.1:4530;
    keepalive 8;
}

server {
    server_name www.octanebula.dev;
    listen 80;
    listen [::]:80;
    return 301 https://octanebula.dev$request_uri;
}

server {
    server_name octanebula.dev;
    listen 80;
    listen [::]:80;

    # current -> releases/<sha>, flipped by deploy.sh (pm2 'website-deploy')
    root /var/www/octanebula.dev/current/dist/client;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # content-hashed build output
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/index.html @astro;
        add_header Cache-Control "no-cache";
    }

    location @astro {
        proxy_pass http://octanebula_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
